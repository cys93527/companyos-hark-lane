name: hark-isolation

# Hark lane H16 (user approval 2026-10-26 08:39: Windows file/network isolation, verified on
# Windows CI runners only - never on a user's PC). Probe: dedicated local account launched via
# CreateProcessWithLogonW into a Job Object, outbound firewall rules scoped to that account SID
# (only the loopback broker port allowed), workspace/kernel grants, userData deny; every change
# is removed and read back. No secrets, no provider calls, no downloads.
on:
  workflow_dispatch:
  push:
    branches: [hark-lane]
    paths:
      - 'scripts/hark/isolation/**'
      - '.github/workflows/hark-isolation.yml'

permissions:
  contents: read

jobs:
  isolation-probe:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: isolation probe (account + firewall + ACL + job, then cleanup)
        shell: powershell
        run: |
          # Native stderr must not become a terminating error of this wrapper (the probe judges itself).
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path hark-evidence | Out-Null
          node --version | Out-File hark-evidence/node-version.txt
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/hark/isolation/probe.ps1 -OutDir "$PWD\hark-evidence" *> hark-evidence/probe.log
          $code = $LASTEXITCODE
          Get-Content hark-evidence/probe.log
          exit $code
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hark-isolation-evidence
          path: hark-evidence/
          if-no-files-found: warn

  # H16b: the PRODUCTION helper (scripts/hark/isolation/setup.ps1) end to end - install, persistent status,
  # isolated agent child, standard-user status, WFP/ACL tamper -> ISOLATION_DEGRADED, repair, uninstall read-back.
  isolation-lifecycle:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: isolation lifecycle (setup.ps1 install/status/tamper/repair/uninstall)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path hark-evidence | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/hark/isolation/lifecycle.ps1 -OutDir "$PWD\hark-evidence" *> hark-evidence/lifecycle.log
          $code = $LASTEXITCODE
          Get-Content hark-evidence/lifecycle.log
          exit $code
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hark-isolation-lifecycle-evidence
          path: hark-evidence/
          if-no-files-found: warn
