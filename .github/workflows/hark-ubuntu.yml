name: hark-ubuntu

# H14 — Ubuntu offline gate for the Hark lane. No secrets, no Provider/DSH, no Electron
# binary download, no new dependencies (frozen lockfile, lifecycle scripts off). Every
# vitest failure must be a listed ENVIRONMENT-BOUND entry of
# scripts/hark/ubuntu-vitest-baseline.json (each with its reason); anything else fails.
on:
  workflow_dispatch:
  push:
    branches:
      - hark-lane

permissions:
  contents: read

concurrency:
  group: hark-ubuntu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: hark ubuntu offline gate (ubuntu-24.04, node 24.19.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      COMPANYOS_TEST_MODE: OFFLINE
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable pnpm 11.25.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Use Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Host identity
        run: |
          mkdir -p hark-evidence
          { echo "commit=$(git rev-parse HEAD)"; echo "tree=$(git rev-parse 'HEAD^{tree}')"; echo "os=$(lsb_release -ds)"; echo "kernel=$(uname -srm)"; echo "node=$(node --version)"; echo "pnpm=$(pnpm --version)"; echo "cpus=$(nproc)"; } | tee hark-evidence/host.txt

      - name: Install (frozen lockfile, no lifecycle scripts)
        run: set -o pipefail; pnpm install --frozen-lockfile --ignore-scripts 2>&1 | tee hark-evidence/install.log

      - name: Typecheck
        run: set -o pipefail; pnpm -s typecheck 2>&1 | tee hark-evidence/typecheck.log

      - name: Lint (full eslint)
        run: set -o pipefail; pnpm -s lint 2>&1 | tee hark-evidence/lint.log

      - name: Hark offline tests
        run: set -o pipefail; node scripts/hark/test-hark-offline.mjs 2>&1 | tee hark-evidence/hark-offline.log

      - name: Architecture gates
        run: |
          set -o pipefail
          node scripts/check-boundaries.mjs 2>&1 | tee hark-evidence/check-boundaries.log
          node scripts/check-architecture.mjs 2>&1 | tee hark-evidence/check-architecture.log

      - name: Build libs + desktop dist (subprocess tests import apps/desktop/dist)
        run: set -o pipefail; { pnpm run -s build:libs && pnpm run -s build:desktop; } 2>&1 | tee hark-evidence/build.log

      - name: Full vitest (deterministic suite)
        run: |
          set +e
          npx vitest run --reporter=default --reporter=json --outputFile.json=hark-evidence/vitest.json > hark-evidence/vitest-full.txt 2>&1
          echo "vitest exit $?" | tee -a hark-evidence/vitest-full.txt
          exit 0

      - name: Compare against the triaged baseline
        run: node scripts/hark/compare-vitest-baseline.mjs hark-evidence/vitest.json scripts/hark/ubuntu-vitest-baseline.json hark-evidence/vitest-baseline-compare.json 2>&1 | tee hark-evidence/vitest-baseline-compare.txt; exit ${PIPESTATUS[0]}

      - name: Upload evidence (always, first failure kept)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hark-ubuntu-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: hark-evidence/
          retention-days: 30
